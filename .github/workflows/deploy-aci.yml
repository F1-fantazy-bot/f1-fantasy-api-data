name: Deploy ACI

on:
  workflow_call:
    inputs:
      image:
        description: Exact image produced by the successful build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: Image tag or digest to deploy
        default: f1fantasyacr.azurecr.io/f1-fantasy-api-data:latest
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: api-data-aci-weekly
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: f1-fantazy-bot
      DEPLOYMENT_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACI
        run: npm run deploy:aci -- --parameters "containerImage=$CONTAINER_IMAGE"

      - name: Verify deployed image
        run: |
          deployed_image=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name f1-fantasy-api-data-aci \
            --query 'containers[0].image' --output tsv --only-show-errors)
          test "$deployed_image" = "$CONTAINER_IMAGE"
