name: Build and Deploy API Data

on:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-data-release
  cancel-in-progress: false

env:
  REGISTRY_NAME: f1fantasyacr.azurecr.io
  IMAGE_NAME: f1-fantasy-api-data

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        run: az acr login -n f1fantasyacr

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-weekly:
    needs: build-and-push
    uses: ./.github/workflows/deploy-aci.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit

  deploy-locked:
    needs: build-and-push
    uses: ./.github/workflows/deploy-aci-locked.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit
