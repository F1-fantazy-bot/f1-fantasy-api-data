name: Deploy ACI (locked)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: api-data-aci-locked
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: f1-fantazy-bot
      DEPLOYMENT_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_IMAGE: f1fantasyacr.azurecr.io/f1-fantasy-api-data:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy locked ACI
        run: npm run deploy:aci-locked -- --parameters "containerImage=$CONTAINER_IMAGE"

      - name: Verify deployed image
        run: |
          deployed_image=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name f1-fantasy-api-data-aci-locked \
            --query 'containers[0].image' --output tsv --only-show-errors)
          test "$deployed_image" = "$CONTAINER_IMAGE"
